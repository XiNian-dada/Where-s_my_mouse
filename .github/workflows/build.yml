name: Release Build

# 触发机制：当你推送类似 v1.0, v1.0.1 这样的标签时触发
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest
    
    steps:
    # 1. 检出代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 配置 MinGW 编译环境
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          git
          base-devel
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-toolchain

    # 3. 编译 
    - name: Compile
      shell: msys2 {0}
      run: |
        gcc main.c -o "Where's My Mouse.exe" \
          -O2 -s \
          -municode \
          -mwindows \
          -lgdi32 -luser32 -ldwmapi -lcomdlg32 -lcomctl32 -ladvapi32 -lshell32 -lwinmm

    # 4. 创建 Release 并上传
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: "Where's My Mouse.exe"
        body: ${{ github.event.head_commit.message }}
        token: ${{ secrets.GITHUB_TOKEN }}