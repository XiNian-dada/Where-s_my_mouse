name: Manual Release Build

# 触发方式改为：手动触发 (Workflow Dispatch)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0)'
        required: true
        default: 'v1.0' # 这里就是你想要的硬编码默认值
      message:
        description: 'Release Description'
        required: true
        default: '手动构建发布'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          git
          base-devel
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-toolchain

    # 1. 编译资源文件 (把版本号打进 exe)
    - name: Compile Resources
      shell: msys2 {0}
      run: windres resources.rc -o resources.o

    # 2. 编译主程序 (链接资源文件)
    - name: Compile EXE
      shell: msys2 {0}
      run: |
        gcc main.c resources.o -o "Where's My Mouse.exe" \
          -O2 -s \
          -municode \
          -mwindows \
          -lgdi32 -luser32 -ldwmapi -lcomdlg32 -lcomctl32 -ladvapi32 -lshell32 -lwinmm

    # 3. 发布 Release
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ inputs.version }} # 使用你手动输入的版本号
        name: Release ${{ inputs.version }}
        body: ${{ inputs.message }}
        files: "Where's My Mouse.exe"
        draft: false
        prerelease: false